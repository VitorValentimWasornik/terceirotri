<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Jorge Ben Jor</title>
    <link rel="stylesheet" href="style cadastro.css">
</head>

<body>

    <nav class="menu">
        <div class="links">
            <a href="index.html" class="link">Home</a>
            <a href="galeria.html" class="link">Galeria</a>
            <a href="chat.html" class="link">Chat</a>
            <a href="cadastro.html" class="link">Cadastro</a>
            <a href="login.html" class="link">Login</a>
        </div>
    </nav>

    <main>

        <div class="titulo-area">
            <span class="status">● No ar</span>
            <h1>Cadastro</h1>
            <p>Crie seu acesso e entre na roda do samba rock</p>
        </div>

        <div class="container">

            <div class="disco" id="disco">
                <div class="disco-meio"></div>
            </div>

            <h2>Novo usuário</h2>

            <div class="linha"></div>

            <div class="campo-grupo">
                <label for="usuario">Nome do usuário</label>
                <input type="text" id="usuario" placeholder="Digite seu nome">
            </div>

            <div class="campo-grupo">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail">
            </div>

            <div class="campo-grupo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Mínimo de 6 caracteres">
            </div>

            <button id="btnCadastro">Criar cadastro</button>

            <div id="cadMensagem" class="mensagem"></div>
            <div id="cadAlerta" class="alerta"></div>

        </div>

    </main>

    <footer>
        MPB © 2026 | Desenvolvido por Vitor Valentim
    </footer>

    <script>
        const btnCadastro = document.querySelector('#btnCadastro');
        const cadMensagem = document.querySelector('#cadMensagem');
        const cadAlerta = document.querySelector('#cadAlerta');
        const disco = document.querySelector('#disco');

        btnCadastro.addEventListener('click', async () => {
            const usuarioEntrada = document.querySelector('#usuario');
            const emailEntrada = document.querySelector('#email');
            const senhaEntrada = document.querySelector('#senha');

            const usuarioDigitado = usuarioEntrada.value.trim();
            const emailDigitado = emailEntrada.value.trim();
            const senhaDigitada = senhaEntrada.value;

            cadAlerta.innerText = '';

            if (!usuarioDigitado || !emailDigitado || !senhaDigitada) {
                cadMensagem.innerText = 'Preencha todos os campos antes de enviar!';
                cadMensagem.style.color = '#e6392b';
                return;
            }

            if (!emailDigitado.includes('@') || !emailDigitado.includes('.')) {
                cadMensagem.innerText = 'Digite um e-mail válido!';
                cadMensagem.style.color = '#e6392b';
                return;
            }

            if (senhaDigitada.length < 6) {
                cadMensagem.innerText = 'A senha deve ter pelo menos 6 caracteres!';
                cadMensagem.style.color = '#e6392b';
                return;
            }

            cadMensagem.innerText = 'Aguarde, cadastrando no servidor...';
            cadMensagem.style.color = '#ffd700';
            disco.classList.add('girando');

            try {
                const respostaBe = await fetch('/cadastro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        usuario: usuarioDigitado,
                        email: emailDigitado,
                        senha: senhaDigitada
                    })
                });

                const dados = await respostaBe.json();
                disco.classList.remove('girando');

                if (!respostaBe.ok) {
                    cadMensagem.innerText = `${dados.erro}`;
                    cadMensagem.style.color = '#e6392b';
                    return;
                }

                cadMensagem.innerText = `${dados.mensagem}: ${dados.perfil}`;
                cadMensagem.style.color = '#2ecc71';

                usuarioEntrada.value = '';
                emailEntrada.value = '';
                senhaEntrada.value = '';

            } catch (erro) {
                console.error('Erro na requisição:', erro);
                disco.classList.remove('girando');
                cadMensagem.innerText = 'Erro ao conectar com o servidor!';
                cadMensagem.style.color = '#e6392b';
            }
        });
    </script>

</body>

</html>
